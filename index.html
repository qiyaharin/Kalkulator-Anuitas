<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Anuitas</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 40px 20px;
      color: #333;
    }
    .container {
      max-width: 650px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h2 {
      margin-top: 0;
      color: #1e293b;
      font-size: 22px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
      color: #334155;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, select:focus {
      border-color: #2563eb;
    }
    button {
      width: 100%;
      background-color: #2563eb;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .result-section {
      margin-top: 30px;
      display: none;
    }
    .summary-card {
      background-color: #eff6ff;
      border-left: 4px solid #2563eb;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 10px;
      text-align: right;
    }
    th {
      background-color: #f8fafc;
      text-align: center;
      font-weight: 600;
    }
    td:first-child, th:first-child {
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Input Parameter Soal</h2>
    
    <div class="form-group">
      <label for="periodeType">Jenis Periode pada Soal:</label>
      <select id="periodeType">
        <option value="bulan">Bulanan (Bunga & Jangka Waktu per Bulan)</option>
        <option value="tahun">Tahunan (Bunga & Jangka Waktu per Tahun)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="modal">Besar Pinjaman / Modal Awal (M):</label>
      <input type="number" id="modal" value="10000000" placeholder="Contoh: 10000000">
    </div>

    <div class="form-group">
      <label for="bunga" id="labelBunga">Suku Bunga per Bulan (%):</label>
      <input type="number" step="0.01" id="bunga" value="2" placeholder="Contoh: 2">
    </div>

    <div class="form-group">
      <label for="tenor" id="labelTenor">Lama Periode (Jumlah Bulan):</label>
      <input type="number" id="tenor" value="12" placeholder="Contoh: 12">
    </div>

    <button onclick="hitungAnuitas()">Hitung & Lihat Hasil &#10140;</button>

    <div class="result-section" id="resultSection">
      <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 25px 0;">
      <h3>Hasil Perhitungan</h3>
      <div class="summary-card">
        <strong>Anuitas per Periode:</strong> <span id="outAnuitas" style="font-size: 18px; color: #2563eb; font-weight: bold;"></span>
      </div>

      <h4>Tabel Amortisasi / Pelunasan</h4>
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Bunga</th>
            <th>Angsuran Pokok</th>
            <th>Sisa Pinjaman</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // Dinamis merubah label jika periode diganti
    document.getElementById('periodeType').addEventListener('change', function() {
      const type = this.value;
      if (type === 'tahun') {
        document.getElementById('labelBunga').innerText = 'Suku Bunga per Tahun (%)';
        document.getElementById('labelTenor').innerText = 'Lama Periode (Jumlah Tahun)';
      } else {
        document.getElementById('labelBunga').innerText = 'Suku Bunga per Bulan (%)';
        document.getElementById('labelTenor').innerText = 'Lama Periode (Jumlah Bulan)';
      }
    });

    function formatRupiah(angka) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(angka);
    }

    function hitungAnuitas() {
      const M = parseFloat(document.getElementById('modal').value);
      const i = parseFloat(document.getElementById('bunga').value) / 100;
      const n = parseInt(document.getElementById('tenor').value);

      if (isNaN(M) || isNaN(i) || isNaN(n) || M <= 0 || n <= 0) {
        alert("Harap masukkan input angka yang valid!");
        return;
      }

      // Rumus Anuitas: A = M * (i / (1 - (1 + i)^(-n)))
      const A = M * (i / (1 - Math.pow(1 + i, -n)));

      document.getElementById('outAnuitas').innerText = formatRupiah(A);

      let sisa = M;
      let tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      for (let k = 1; k <= n; k++) {
        let bungaBulan = sisa * i;
        let angsuranPokok = A - bungaBulan;
        sisa = sisa - angsuranPokok;

        if (k === n || sisa < 0) sisa = 0; // Pembulatan di periode terakhir

        let tr = `<tr>
          <td>${k}</td>
          <td>${formatRupiah(bungaBulan)}</td>
          <td>${formatRupiah(angsuranPokok)}</td>
          <td>${formatRupiah(sisa)}</td>
        </tr>`;
        tbody.innerHTML += tr;
      }

      document.getElementById('resultSection').style.display = 'block';
    }
  </script>
</body>
</html>
